name: CI

on:
  push:
    branches:
      - main
    tags: ['*']
    paths-ignore: ['docs/**', '**.md', '.claude/**']
  pull_request:
    paths-ignore: ['docs/**', '**.md', '.claude/**']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.suite || 'all' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1'      # current Julia 1.x stable; default cells resolve Optim v2
        os:
          - ubuntu-latest
        arch:
          - x64
        suite:
          - dsge
          - empirical
          - empirical2
          - serialization
        include:
          - version: '1'
            os: macos-latest
            arch: arm64
            suite: dsge
          - version: '1'
            os: macos-latest
            arch: arm64
            suite: empirical
          - version: '1'
            os: macos-latest
            arch: arm64
            suite: empirical2
          - version: '1'
            os: macos-latest
            arch: arm64
            suite: serialization
          # Windows FAST: four suites. One combined cell ran 48–56 min and
          # raced serialization helpers with DSER in the same process (#708).
          - version: '1'
            os: windows-latest
            arch: x64
            suite: dsge
            fast: true
          - version: '1'
            os: windows-latest
            arch: x64
            suite: empirical
            fast: true
          - version: '1'
            os: windows-latest
            arch: x64
            suite: empirical2
            fast: true
          - version: '1'
            os: windows-latest
            arch: x64
            suite: serialization
            fast: true
          # Dual-major Optim compat (T153/#252): Julia 1.10, Optim@1,
          # MACRO_NUMERICAL_CI. Split like the other full-sampling cells so
          # no job sits near the 60 min timeout.
          - version: '1.10'
            os: ubuntu-latest
            arch: x64
            optim_v1: true
            suite: dsge
          - version: '1.10'
            os: ubuntu-latest
            arch: x64
            optim_v1: true
            suite: empirical
          - version: '1.10'
            os: ubuntu-latest
            arch: x64
            optim_v1: true
            suite: empirical2
          - version: '1.10'
            os: ubuntu-latest
            arch: x64
            optim_v1: true
            suite: serialization

    steps:
      - uses: actions/checkout@v7

      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}

      # Native pkgimages (#708): do not set JULIA_CPU_TARGET. GitHub-hosted
      # SKUs differ (westus vs eastus vs northcentralus), so a cache from
      # one CPU is rejected on another. Key compiled/ by Sys.CPU_NAME so
      # each SKU keeps its own native cache instead of a fat multi-target
      # compile. First hit per SKU is a cold miss; later hits are native.
      - name: Detect Julia CPU name
        id: cpu
        shell: bash
        run: |
          cpu=$(julia --startup-file=no -e 'print(Sys.CPU_NAME)')
          cpu=${cpu:-unknown}
          cpu=${cpu//[^-a-zA-Z0-9_.]/_}
          echo "name=${cpu}" >> "$GITHUB_OUTPUT"
          echo "Julia CPU_NAME=${cpu}"

      - uses: julia-actions/cache@v3
        with:
          # Windows depot artifacts are ~1.5 GB (3× Linux) and dominate the
          # 4-minute cache upload. compiled/ is what Pkg.test reuse needs.
          cache-artifacts: ${{ matrix.os != 'windows-latest' }}
          # include-matrix (default true) puts matrix.suite in the key, so the
          # dsge, empirical, and serialization jobs do not share compiled/.
          # Intra-job pidfile races are handled by _warm_compile_cache in
          # test/runtests.jl, not by splitting this cache further.
          # cpu= splits native pkgimages across GitHub-hosted CPU SKUs.
          cache-name: julia-cache;workflow=${{ github.workflow }};job=${{ github.job }};cpu=${{ steps.cpu.outputs.name }}

      # Optim v1 dual-major compat cell (T153/#252): pin Optim to the v1 major before
      # instantiate/precompile so the suite runs against Optim v1 (default cells resolve v2).
      - name: Pin Optim to the v1 major
        if: matrix.optim_v1
        run: julia --project=. -e 'using Pkg; Pkg.add(Pkg.PackageSpec(name="Optim", version="1"))'

      - uses: julia-actions/julia-buildpkg@v1

      # Cell roles:
      #   ubuntu stable  — full suite, split dsge | empirical | serialization; Optim v2; no coverage
      #   ubuntu 1.10    — numerical profile, same three suites, Optim v1 pin, --check-bounds=yes
      #   macos          — FAST=1 smoke, split dsge | empirical | serialization; Codecov every run
      #   ubuntu stable serialization — also Codecov (full sampling + Coverage-A/B/C)
      #   windows        — FAST=1 smoke, split dsge | empirical | serialization (#708)
      #
      # Default cells use the threaded single-process runner (package loaded
      # once). Julia 1.12 compile is 2–3× 1.10; multiprocess paid that per
      # child. HA-DSGE still gets 2 OpenBLAS threads via the runner; every
      # other group stays at 1. The 1.10 numerical cell stays multiprocess
      # (smaller set, cheaper compile).
      - uses: julia-actions/julia-runtest@v1
        with:
          coverage: ${{ matrix.os == 'macos-latest' || (matrix.os == 'ubuntu-latest' && matrix.version == '1' && matrix.suite == 'serialization') }}
          # Pkg.test / julia-runtest default is --check-bounds=yes, which
          # re-precompiles the depot vs julia-buildpkg and honors no @inbounds.
          # Windows: auto (REPL default) so NTFS does not pay that wave.
          # 1.10 Optim-v1 cell: yes (MACRO_CHECK_BOUNDS also forces children).
          check_bounds: ${{ matrix.os == 'windows-latest' && 'auto' || 'yes' }}
        env:
          JULIA_NUM_THREADS: ${{ matrix.version == '1.10' && '1' || 'auto' }}
          OPENBLAS_NUM_THREADS: "1"
          MACRO_MULTIPROCESS_TESTS: ${{ matrix.version == '1.10' && '1' || '0' }}
          # Windows (`fast: true`) and macOS: reduced-sampling smoke. Ubuntu: full.
          MACRO_FAST_TESTS: ${{ (matrix.fast || matrix.os == 'macos-latest') && '1' || '0' }}
          MACRO_NUMERICAL_CI: ${{ matrix.optim_v1 && '1' || '0' }}
          MACRO_CHECK_BOUNDS: ${{ matrix.optim_v1 && '1' || '0' }}
          MACRO_CI_SUITE: ${{ matrix.suite }}

      - uses: julia-actions/julia-processcoverage@v1
        if: matrix.os == 'macos-latest' || (matrix.os == 'ubuntu-latest' && matrix.version == '1' && matrix.suite == 'serialization')

      - uses: codecov/codecov-action@v7
        if: matrix.os == 'macos-latest' || (matrix.os == 'ubuntu-latest' && matrix.version == '1' && matrix.suite == 'serialization')
        with:
          files: lcov.info
          slug: FriedmanJP/MacroEconometricModels.jl
          fail_ci_if_error: false
          flags: ${{ matrix.suite }}
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # RNG-everywhere lint (#243): every drawing function must thread an rng; no bare
  # rand/randn on the global RNG in src/. Dependency-free (no Julia), so it runs fast.
  rng-lint:
    name: RNG-everywhere lint (#243)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Ban bare rand/randn on the global RNG in src/
        run: |
          # Docstring-aware: skips content inside """...""" blocks and # comment lines, so
          # docstring `# Examples` (randn(n), randn(200,3), rand(1:k), …) are not flagged.
          # Whitelist on real-code lines: rng-threaded draws whose first argument is named
          # `rng`, `<prefix>_rng`, or `rng_<suffix>` (rand(rng,…)/randn(local_rng,…)/
          # randn(rng_fit,…)); MersenneTwister/Xoshiro/Random.default_rng seeds; and an explicit
          # `# rng-lint: ignore` opt-out. Everything else drawing bare on the global RNG fails.
          viol=$(awk '
            FNR==1 { indoc=0 }
            {
              tmp=$0; c=gsub(/"""/,"",tmp); startin=indoc
              k=c; while (k-- > 0) indoc=!indoc
              if (startin || (c % 2 == 1)) next
              if ($0 ~ /^[[:space:]]*#/) next
              if ($0 !~ /(^|[^A-Za-z_.])(rand|randn|randn!)\(/) next
              line=$0
              if (line ~ /\(([A-Za-z_][A-Za-z_0-9]*_)?rng(_[A-Za-z_0-9]+)?[,)]/) next
              if (line ~ /(MersenneTwister|Xoshiro|Random\.default_rng|rand\(UInt)/) next
              if (line ~ /# *rng-lint: *ignore/) next
              printf("%s:%d:%s\n", FILENAME, FNR, $0)
            }
          ' $(find src -name "*.jl" | sort))
          if [ -n "$viol" ]; then
            echo "::error::Bare rand/randn drawing on the global RNG (see #243 rng-everywhere policy):"
            echo "$viol"
            exit 1
          fi
          echo "rng-lint OK — no bare rand/randn in src/"

  # GPL-3.0-only license compliance lint (#930-#933): verifies no GPL-incompatible
  # solver JLLs in default [deps], no MKL dispatch in src/test, FFTW defaults to
  # GPL-compatible fftw provider, and bundled datasets are strict UTF-8 & clean.
  license-compliance:
    name: License compliance (#930-#933)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - name: Static source & dataset license checks
        run: |
          if git grep -n -E '^[^#]*(MKLLUFactorization|set_provider!\("mkl"\))' -- src/ ext/ test/; then
            echo "::error::Forbidden proprietary MKL invocation found in src/, ext/, or test/ (#931)"
            exit 1
          fi
          if git grep -n -E '(^|[^A-Za-z])GPL-3\.0-or-later' -- src/ ext/ test/ README.md CONTRIBUTING.md DATA_LICENSES.md THIRD_PARTY_LICENSES.md docs/src/index.md docs/src/citation.md; then
            echo "::error::Stale GPL-3.0-or-later header found (package is GPL-3.0-only)"
            exit 1
          fi
          echo "Static source checks OK"
      - name: Verify default dependency graph, FFTW/LinearSolve non-MKL, and dataset UTF-8/provenance
        run: |
          julia --startup-file=no -e '
            using Pkg, TOML
            proj = TOML.parsefile("Project.toml")
            @assert !haskey(proj["deps"], "Ipopt") "Ipopt must remain in [weakdeps], not [deps] (#930)"
            @assert haskey(proj["weakdeps"], "Ipopt") "Ipopt must be declared in [weakdeps]"
            @assert !haskey(proj["deps"], "PATHSolver") "PATHSolver must remain in [weakdeps], not [deps]"
            @assert haskey(proj["weakdeps"], "PATHSolver") "PATHSolver must be declared in [weakdeps]"
            @assert haskey(proj["deps"], "MadNLP") "MadNLP must be declared in [deps] (#930)"
            @assert haskey(proj["deps"], "NLPModels") "NLPModels must be declared in [deps] (#930)"
            isempty(Pkg.Registry.reachable_registries()) && Pkg.Registry.add("General")
            mktempdir() do dir
                # 1. Resolve the exact unmodified Project.toml and verify zero GPL-incompatible
                #    packages enter the default Manifest.toml.
                cp("Project.toml", joinpath(dir, "Project.toml"))
                Pkg.activate(dir)
                Pkg.resolve()
                m = Pkg.Types.read_manifest(joinpath(dir, "Manifest.toml"))
                forbidden = Set(["Ipopt", "Ipopt_jll", "MUMPS_seq_jll", "MUMPS_jll",
                                 "SPRAL_jll", "METIS_jll", "ASL_jll", "HSL_jll",
                                 "PATHSolver", "PATH_jll"])
                hits = [p.second.name for p in m.deps if p.second.name in forbidden]
                @assert isempty(hits) "GPL-incompatible packages found in default Manifest: $hits (#930)"
                # 2. Verify downstream LocalPreferences.toml pins disable MKL_jll and keep FFTW on
                #    GPL-compatible fftw. Preferences.jl only reads [LinearSolve] when LinearSolve
                #    is listed in [deps] or [extras] of the active Project.toml, so add it to
                #    [extras] in the temp copy and verify in a fresh Julia subprocess (avoiding
                #    world-age issues and skipping precompilation of unrelated deps).
                ls_uuid = "7ed4a6bd-45a5-4d45-b8e1-4c9b2323eb65"
                ptxt = read(joinpath(dir, "Project.toml"), String)
                ptxt = replace(ptxt, "[extras]\n" => "[extras]\nLinearSolve = \"$ls_uuid\"\n")
                write(joinpath(dir, "Project.toml"), ptxt)
                write(joinpath(dir, "LocalPreferences.toml"), """
                [LinearSolve]
                LoadMKL_JLL = false

                [FFTW]
                provider = "fftw"
                """)
                withenv("JULIA_PKG_PRECOMPILE_AUTO" => "0") do
                    Pkg.instantiate()
                end
                check_code = """
                    prefs = Base.get_preferences(Base.UUID("$ls_uuid"))
                    @assert get(prefs, "LoadMKL_JLL", nothing) === false "LinearSolve LoadMKL_JLL preference was not active: \$prefs (#931)"
                    import FFTW, NonlinearSolve
                    @assert FFTW.fftw_provider == "fftw" "FFTW provider must default to fftw (#931)"
                    @assert !NonlinearSolve.LinearSolve.usemkl "LinearSolve.usemkl must be false when LoadMKL_JLL = false (#931)"
                    @assert !any(k -> k.name == "MKL_jll", keys(Base.loaded_modules)) "MKL_jll must not be loaded when LoadMKL_JLL = false (#931)"
                    println("Runtime FFTW/LinearSolve non-MKL verification PASSED")
                """
                run(`$(Base.julia_cmd()) --startup-file=no --project=$dir -e $check_code`)
            end
            for f in readdir("data")
                endswith(f, ".toml") || continue
                bytes = read(joinpath("data", f))
                @assert isvalid(String, bytes) "data/$f is not valid UTF-8 (#932)"
                TOML.parsefile(joinpath("data", f))
            end
            md = TOML.parsefile("data/fred_md.toml")
            qd = TOML.parsefile("data/fred_qd.toml")
            for bad in ("S&P 500", "S&P div yield", "S&P PE ratio", "AAA", "BAA",
                        "AAAFFM", "BAAFFM", "UMCSENTx", "VIXCLSx", "HWI", "HWIURATIO", "OILPRICEx")
                @assert !(bad in md["variables"]["names"]) "Commercial series $bad in fred_md.toml (#932)"
            end
            for bad in ("S&P 500", "S&P div yield", "S&P PE ratio", "SPCS10RSA", "SPCS20RSA",
                        "AAA", "BAA", "BAA10YM", "AAAFFM", "MORTGAGE30US", "MORTG10YRx",
                        "UMCSENTx", "VIXCLSx", "USEPUINDXM", "NIKKEI225", "NASDAQCOM",
                        "HWIx", "HWIURATIOx", "OILPRICEx")
                @assert !(bad in qd["variables"]["names"]) "Commercial series $bad in fred_qd.toml (#932)"
            end
            pwt = TOML.parsefile("data/pwt.toml")
            @assert pwt["metadata"]["license"] == "CC-BY-4.0" "pwt.toml missing CC-BY-4.0 metadata (#932)"
            println("License compliance gate PASSED")
          '
