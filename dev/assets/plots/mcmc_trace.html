        padding: 20px;
    }

        font-weight: 600;
        text-align: center;
        margin-bottom: 16px;
        color: var(--mem-ink-strong);

        gap: 16px;
        justify-content: center;

        font-weight: 600;
        text-align: center;

        border-radius: 4px;
        font-size: 11px;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.15s;
        z-index: 1000;
    }

    .legend rect { rx: 2; }
    svg { overflow: visible; }
