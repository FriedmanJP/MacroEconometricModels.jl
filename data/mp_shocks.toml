# US quarterly monetary-policy panel, 1960Q1-2019Q4 (240 obs), assembled from
# the published data appendix of McKay & Wolf (2023, Econometrica 91(5),
# "What Can Time-Series Regressions Tell Us About Policy Counterfactuals?"),
# replication file empirics/_data/_data.csv. Macro block: HP-filtered log real
# GDP gap (ygap), GDP-deflator inflation computed here as 400*dlog(PGDP)
# (infl), federal funds rate (ffr), log commodity price index (lpcom).
# Policy-shock block (NaN outside each series' published sample; NaN is NOT
# zero -- zero is a valid shock value): Romer-Romer narrative shocks in the
# Wieland-Yang update (rr), Gertler-Karadi tight-window high-frequency mp1
# surprises (mp1), Aruoba-Drechsel machine-learning narrative shocks (ad),
# and the Ben Zeev-Khan IST news shock -- McKay-Wolf's baseline NON-policy
# disturbance (bzk_ist). All series are published, publicly available
# research data; see source_refs for the underlying citations. Used by
# load_example(:mp_shocks) for the policy-counterfactual examples (CF-20, #400).
[metadata]
desc = "US quarterly monetary panel with published policy-shock series, 1960Q1-2019Q4 (McKay-Wolf 2023 data appendix)"
frequency = "Quarterly"
n_obs = 240
start_year = 1960
end_year = 2019
source = "McKay & Wolf (2023, ECMA) replication data appendix; underlying series: FRED (GDP, GDPDEF, FEDFUNDS, commodity prices), Romer-Romer (2004) / Wieland-Yang (2020) update, Gertler-Karadi (2015), Aruoba-Drechsel (2024), Ben Zeev-Khan (2016)."
source_refs = ["mckay_wolf2023", "romer_romer2004", "wieland_yang2020", "gertler_karadi2015", "aruoba_drechsel2024", "ben_zeev_khan2016"]

[variables]
names = ["ygap", "infl", "ffr", "lpcom", "rr", "mp1", "ad", "bzk_ist"]
tcodes = [1, 1, 1, 1, 1, 1, 1, 1]

[descriptions]
ygap = "Output gap: HP-filtered log real GDP, percent (100x log deviation from trend)"
infl = "GDP-deflator inflation, annualized quarterly rate, percent (400 x dlog GDPDEF)"
ffr = "Effective federal funds rate, percent per annum"
lpcom = "Log commodity price index (level of logs)"
rr = "Romer-Romer (2004) narrative monetary shock, Wieland-Yang (2020) update, percentage points; NaN outside sample"
mp1 = "Gertler-Karadi (2015) tight-window high-frequency FFR surprise (mp1_tc), percentage points; NaN outside sample"
ad = "Aruoba-Drechsel (2024) narrative machine-learning monetary shock, percentage points; NaN outside sample"
bzk_ist = "Ben Zeev-Khan (2016) IST news shock (standardized units) -- the McKay-Wolf baseline NON-policy shock; NaN outside sample"

