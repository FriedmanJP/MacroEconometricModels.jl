coverage:
  precision: 2
  round: down
  range: "70...100"

  # macOS FAST cells upload on every CI run (dsge | empirical flags). Keep
  # GitHub checks informational so a thin FAST report cannot block a PR.
  status:
    project:
      default:
        target: auto
        threshold: 1%
        informational: true
    patch:
      default:
        target: auto
        threshold: 1%
        informational: true

comment:
  layout: "reach,diff,flags,tree"
  behavior: default
  require_changes: true
